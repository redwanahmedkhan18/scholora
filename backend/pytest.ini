[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
markers =
    pg: needs a real PostgreSQL server (SCHOLARA_PG_URL); must not skip when PostgreSQL is required
    redis_live: needs a real Redis server (SCHOLARA_REDIS_URL); must not skip when Redis is required
    smtp_live: runs a real SMTP conversation on loopback; no external mail provider is contacted
filterwarnings =
    ignore::DeprecationWarning
